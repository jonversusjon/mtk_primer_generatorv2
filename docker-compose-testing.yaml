services:
  backend:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=testing
      - FLASK_TESTING=true
      - CONFIG_MODULE=flask_backend.config.testing_config
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    command: celery -A flask_backend.celery_worker.celery worker --loglevel=info
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=testing
      - FLASK_TESTING=true
      - CONFIG_MODULE=flask_backend.config.testing_config
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
